<!doctype html>

    <meta charset="utf-8" />

      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <script>
      /* Runs before first paint so the page never flashes the wrong theme or language. React reads these values afterwards. */
      (function () {
        var r = document.documentElement,
          t = null,
          l = null;
        try {
          t = localStorage.getItem("theme");
        } catch (e) {}
        if (t !== "dark" && t !== "light")
          t = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        r.setAttribute("data-theme", t);
        try {
          l = localStorage.getItem("lang");
        } catch (e) {}
        var m = /[?&]lang=(en|fr|ar)(?:&|$)/.exec(location.search);
        if (m) l = m[1];
        if (l !== "en" && l !== "fr" && l !== "ar") {
          var n = navigator.languages || [navigator.language || "en"];
          l = "en";
          for (var i = 0; i < n.length; i++) {
            var c = String(n[i]).slice(0, 2).toLowerCase();
            if (c === "ar" || c === "fr" || c === "en") {
              l = c;
              break;
            }
          }
        }
        r.lang = l;
        r.dir = l === "ar" ? "rtl" : "ltr";
      })();
    </script>
